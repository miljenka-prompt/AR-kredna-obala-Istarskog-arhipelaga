<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <title>Kredna obala istarskog arhipelaga – AR demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <video id="jurska-video" src="Cretaceous_teropod-1.mp4" 
               preload="auto" loop crossorigin="anonymous" 
               playsinline webkit-playsinline muted></video>
      </a-assets>

      <a-marker preset="hiro" id="marker">
        <a-video src="#jurska-video" 
                 rotation="-90 0 0" 
                 height="2" 
                 width="3.5"
                 position="0 0 0">
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      var marker = document.querySelector('#marker');
      var video = document.querySelector('#jurska-video');

      marker.addEventListener('markerFound', function() {
        video.muted = false;
        video.play();
      });

      marker.addEventListener('markerLost', function() {
        video.pause();
      });
    </script>
  </body>
</html>
